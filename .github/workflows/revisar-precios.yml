# Llama cada hora al endpoint de revisión; la app decide si toca revisar según las
# revisiones al día elegidas en la administración (el plan gratuito de Vercel solo
# permite un cron al día, que queda de respaldo).
# Configura en GitHub → Settings → Secrets and variables → Actions:
#   APP_URL      → https://tu-app.vercel.app
#   CRON_SECRET  → el mismo valor que en Vercel
name: Revisar precios

on:
  schedule:
    - cron: "5 * * * *" # cada hora, a los 5 minutos
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de revisión
        run: |
          curl --fail-with-body --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/revisar-precios"
